<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanarClip</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .header {
        text-align: center;
        padding: 12px 0;
      }
      .header h1 { font-size: 20px; font-weight: 600; color: #ffffff; }
      .header .subtitle { font-size: 12px; color: #888; margin-top: 4px; }
      .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 16px;
      }
      .card h2 { font-size: 13px; font-weight: 500; color: #999; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
      .status-row { display: flex; align-items: center; gap: 8px; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; }
      .status-dot.online { background: #4ade80; }
      .status-dot.offline { background: #f87171; }
      .status-dot.connecting { background: #fbbf24; animation: pulse 1s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .status-text { font-size: 14px; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #111;
        color: #fff;
        font-size: 18px;
        text-align: center;
        letter-spacing: 4px;
        outline: none;
      }
      input:focus { border-color: #6366f1; }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        color: #fff;
        background: #6366f1;
      }
      button:hover { background: #5558e6; }
      button:disabled { background: #333; color: #666; cursor: default; }
      .pair-code {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 6px;
        text-align: center;
        color: #6366f1;
        padding: 8px;
      }
      .hint { font-size: 11px; color: #666; text-align: center; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>PlanarClip</h1>
        <div class="subtitle" id="version">v0.1.0</div>
      </div>

      <div class="card">
        <h2>Connection Status</h2>
        <div class="status-row">
          <div class="status-dot offline" id="statusDot"></div>
          <span class="status-text" id="statusText">Offline</span>
        </div>
      </div>

      <div class="card" id="pairCard">
        <h2>Device Pairing</h2>
        <div id="pairMode">
          <div id="myCodeSection" style="display:none;">
            <div class="hint" style="margin-bottom:6px;">Your pairing code</div>
            <div class="pair-code" id="myCode">------</div>
            <div class="hint">Enter this code on the other device</div>
          </div>
          <div style="margin-top:10px;">
            <div class="hint" style="margin-bottom:6px;">Enter pairing code from other device</div>
            <input type="text" id="pairInput" maxlength="6" placeholder="000000" />
            <button style="margin-top:8px;" id="pairBtn">Pair</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Last Sync</h2>
        <div class="hint" id="lastSync">No sync yet</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
