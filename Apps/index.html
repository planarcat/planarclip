<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二向贴</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("planarclip-ui-settings");
          if (!raw) {
            return;
          }
          var settings = JSON.parse(raw);
          var scheme = settings.color_scheme;
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var useDark = scheme === "dark" || (scheme === "system" && prefersDark);
          var root = document.documentElement;
          if (useDark) {
            root.classList.add("dark");
          }
          var palettes = {
            cyan: {
              dark: ["#22d3ee", "#0e7490", "#22d3ee"],
              light: ["#0891b2", "#0c4a6e", "#0891b2"],
            },
            violet: {
              dark: ["#a78bfa", "#7c3aed", "#a78bfa"],
              light: ["#7c3aed", "#5b21b6", "#7c3aed"],
            },
            emerald: {
              dark: ["#34d399", "#059669", "#34d399"],
              light: ["#059669", "#065f46", "#059669"],
            },
            rose: {
              dark: ["#fb7185", "#e11d48", "#fb7185"],
              light: ["#e11d48", "#9f1239", "#e11d48"],
            },
          };
          var palette = palettes[settings.theme_color] || palettes.cyan;
          var colors = useDark ? palette.dark : palette.light;
          root.style.setProperty("--primary", colors[0]);
          root.style.setProperty("--accent", colors[1]);
          root.style.setProperty("--ring", colors[2]);
          root.style.setProperty("--primary-foreground", useDark ? "#030b10" : "#ffffff");
        } catch (_error) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
